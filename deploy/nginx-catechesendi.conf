# /etc/nginx/sites-available/catechesendi  (remplacez catechesendi.com par votre domaine)
server {
    listen 80;
    server_name catechesendi.com www.catechesendi.com;
    client_max_body_size 30m;            # imports Excel volumineux
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
# Le certificat HTTPS est ajouté ensuite par :  sudo certbot --nginx -d catechesendi.com -d www.catechesendi.com
