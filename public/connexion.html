document.querySelectorAll('[data-menu]').forEach(function(btn){btn.addEventListener('click',function(e){e.stopPropagation();var m=document.getElementById(btn.dataset.menu),open=!m.classList.contains('open');closeMenus();if(open)m.classList.add('open');btn.setAttribute('aria-expanded',String(open));});});
var bg=document.getElementById('burger'),nl=document.getElementById('nav-links');
if(bg){bg.addEventListener('click',function(){var o=nl.classList.toggle('open');bg.setAttribute('aria-expanded',String(o));});
nl.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){nl.classList.remove('open');bg.setAttribute('aria-expanded','false');});});}
document.addEventListener('click',closeMenus);document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenus();});
</script><script>
(function(){var t=document.getElementById('pwd-toggle'),p=document.getElementById('password');
if(t)t.addEventListener('click',function(){p.type=p.type==='password'?'text':'password';});

var b=document.getElementById('login-submit'),st=document.getElementById('login-status');if(!b)return;
function go(e){if(e)e.preventDefault();var l=document.getElementById('login').value.trim(),pw=p.value;
if(!l||!pw){st.style.color='#B3261E';st.textContent='Veuillez saisir votre login et votre mot de passe.';return;}
/* À relier au serveur : vérifier le login et le mot de passe (table UTILISATEUR) avant d'ouvrir l'application. */
st.style.color='#1D3E8F';st.textContent='Connexion en cours…';b.disabled=true;fetch('api/auth.php?action=login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:l,password:pw})}).then(function(r){return r.json()}).then(function(j){if(j&&j.ok){try{localStorage.setItem('ktuser',j.user.login)}catch(x){}location.href='gestion.html'}else{b.disabled=false;st.style.color='#B3261E';st.textContent=(j&&j.error)||'Connexion impossible.'}}).catch(function(){b.disabled=false;st.style.color='#B3261E';st.textContent='Serveur injoignable. Réessayez.'});}
b.addEventListener('click',go);
[document.getElementById('login'),p].forEach(function(i){i.addEventListener('keydown',function(e){if(e.key==='Enter')go(e);});});
})();
</script>
